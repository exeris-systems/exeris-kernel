sonar.exclusions=**/target/**,**/.idea/**,**/kernel-legacy/**,**/native-libs/**,**/*.md
sonar.coverage.exclusions=**/*Benchmark*.java,**/target/**
# CPD (copy-paste) exclusions for framework-mandated boilerplate where structural repetition is by
# design, not a DRY violation: JMH *Benchmark* harness classes, and JFR @Event classes (flat annotated
# POJOs — @Label/@Description fields + a static emit() begin/set/commit skeleton; 75 of 77 *Event.java
# extend jdk.jfr.Event). Each JFR event must be its own concrete class with its own @Name, so CPD on
# them is noise.
sonar.cpd.exclusions=**/*Benchmark*.java,**/*Event.java
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml
