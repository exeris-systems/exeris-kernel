name: Exeris L0 Citadel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  MAVEN_OPTS: "--enable-preview --enable-native-access=ALL-UNNAMED"

jobs:
  build-and-verify:
    name: Build & TCK Verification (JDK 26)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache JDK 26 tarball
      id: jdk-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/jdk26.tar.gz
        key: jdk-26-b35-linux-x64

    - name: Fetch JDK 26 (Build 35 x64)
      if: steps.jdk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        wget -O ${{ runner.temp }}/jdk26.tar.gz https://download.java.net/java/GA/jdk26/c3cc523845074aa0af4f5e1e1ed4151d/35/GPL/openjdk-26_linux-x64_bin.tar.gz

    - name: Inject JDK 26 into Runner
      uses: actions/setup-java@v5
      with:
        distribution: 'jdkfile'
        jdkFile: ${{ runner.temp }}/jdk26.tar.gz
        java-version: '26.0.0'
        architecture: x64
        cache: maven

    - name: Build & Run TCK Verification (Maven)
      run: mvn clean verify -B -e -Dmaven.compiler.release=26
