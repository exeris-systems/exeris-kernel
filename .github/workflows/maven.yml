name: Exeris L0 Citadel CI

on:
  push:
    branches: [ "main", "development/**" ]   # RC trunk branches (development/0.8, development/0.9, ...) also trigger build + SNAPSHOT publish
  pull_request:
    branches: [ "main", "development/**" ]   # validate PRs targeting RC trunks before merge
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC on default branch (main)

env:
  MAVEN_OPTS: "--enable-preview --enable-final-field-mutation=ALL-UNNAMED --enable-native-access=ALL-UNNAMED"
  JDK_URL: "https://download.java.net/java/GA/jdk26/c3cc523845074aa0af4f5e1e1ed4151d/35/GPL/openjdk-26_linux-x64_bin.tar.gz"
  JDK_SHA256: "83c78367f8c81257beef72aca4bbbf8e6dac8ca2b3a4546a85879a09e6e4e128"
  JDK_CACHE_KEY: "jdk-26-b35-linux-x64"
  JDK_VER: "26.0.0"

jobs:
  build-and-verify:
    name: Build & TCK Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GitHub Packages publish

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Build & Run TCK Verification
        run: mvn clean verify -B -e

      - name: Upload TCK JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-tck-${{ github.run_number }}
          path: |
            exeris-kernel-*/target/*.jfr
            exeris-kernel-*/target/jfr-reports/**/*.jfr
          if-no-files-found: warn
          retention-days: 14

      # Publish to GitHub Packages on push to main (release versions like 0.7.0) AND on push
      # to any RC trunk (development/0.8, development/0.9, ...) where the POM carries a
      # `-SNAPSHOT` qualifier. The same step handles both: Maven routes release versions to
      # <repository> and SNAPSHOTs to <snapshotRepository> (both pointing at GitHub Packages
      # in this repo, but the URL choice is Maven's, not the workflow's).
      #
      # GitHub Packages mutability:
      #   * Release versions are IMMUTABLE — a 409 on retry means the version is already
      #     published, which is not a real failure (covered by continue-on-error).
      #   * SNAPSHOTs are MUTABLE — every push to an RC trunk overwrites the previous
      #     SNAPSHOT artifact so downstream consumers (e.g. exeris-spring-runtime) always
      #     pull the latest RC trunk HEAD.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/development/'))
        continue-on-error: true
        run: |
          mvn deploy -B -e \
            --settings .github/maven-settings.xml \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  persistence-rls-gate:
    name: Persistence RLS/Interceptor Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run persistence RLS integration gate
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            test -B -e

      - name: Upload persistence JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-persistence-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  transport-stress-gate:
    # TCK-064 (v0.8 Sprint 0): dedicated job for @Tag("stress") transport tests.
    # The default `Build & TCK Verification` job excludes the stress group because the
    # constrained 2-vCPU GitHub Actions runner historically deadlocked under thread
    # pressure (see ROADMAP TCK-064). v0.8 Sprint 0 closed the deadlock by replacing
    # `Thread.onSpinWait()` busy-waits with `LockSupport.parkNanos` in client/server
    # echo loops and post-test verification deadlines (`NativeTcpTransportStressTest`).
    # The TCK pinning teardown now exposes a configurable drain budget via
    # `-Dexeris.tck.transport.drainTimeoutSeconds=N` for constrained runners.
    name: Transport Stress Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run transport stress gate
        # TCK-064 root cause (v0.8 Sprint 0): client ingress VTs in this codebase mount
        # onto the JDK virtual-thread carrier pool and call a blocking native `recv()`
        # via Panama FFM (NativeTcpStream.trySocketSeamRead → socketHandles.recv()).
        # That pins the carrier thread for the duration of the syscall — and on a
        # 2-vCPU GitHub Actions runner the default carrier pool size is 2, so a
        # handful of clients trivially exhaust the pool. Server-side echo VTs then
        # cannot mount, no echo data flows, clients block on `recv()` forever.
        #
        # Bumping `jdk.virtualThreadScheduler.parallelism` (steady-state carriers)
        # and `maxPoolSize` (peak carriers) eliminates the starvation: with 16 baseline
        # / 64 peak carriers, the same 10 client × 4 server reactor stress passes in
        # ~0.3 s under taskset -c 0,1. The ROADMAP carry-over for v0.8 transport
        # hardening (Sprint 6 / non-blocking ingress) is the proper long-term fix —
        # this knob is the CI-side workaround that lets the gate fire today.
        #
        # Drain budget 30 s covers the wider tail under thread pressure; local
        # development keeps the strict 5 s default.
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=stress \
            -DexcludedGroups= \
            -Dexeris.tck.transport.drainTimeoutSeconds=30 \
            -Djdk.virtualThreadScheduler.parallelism=16 \
            -Djdk.virtualThreadScheduler.maxPoolSize=64 \
            test -B -e

      - name: Upload transport stress JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-transport-stress-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  benchmarks:
    name: JMH Benchmarks (Community + Core)
    # TODO: point runs-on to a dedicated bare-metal runner when available
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run JMH Benchmarks
        run: |
          mvn -pl exeris-kernel-community,exeris-kernel-core -am install -DskipTests -B -e
          mkdir -p exeris-kernel-community/target/jfr-reports exeris-kernel-core/target/jfr-reports
          mvn -pl exeris-kernel-community -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -B -e
          mvn -pl exeris-kernel-core -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -B -e

      - name: Upload Community benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-community-results
          path: exeris-kernel-community/target/jmh-results.json
          if-no-files-found: warn

      - name: Upload Core benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-core-results
          path: exeris-kernel-core/target/jmh-results.json
          if-no-files-found: warn

      - name: Upload Community benchmark JFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-benchmarks-community-${{ github.run_number }}
          path: exeris-kernel-community/target/jfr-reports/jmh-benchmarks.jfr
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Core benchmark JFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-benchmarks-core-${{ github.run_number }}
          path: exeris-kernel-core/target/jfr-reports/jmh-benchmarks.jfr
          if-no-files-found: warn
          retention-days: 14

  parse-jfr-to-json:
    name: Parse JFR → Lab JSON
    runs-on: ubuntu-latest
    needs: [build-and-verify, persistence-rls-gate, benchmarks]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Build JFR Reporter
        run: mvn -f tools/jfr-reporter/pom.xml clean package -q

      - name: Download TCK JFR recordings
        uses: actions/download-artifact@v4
        with:
          name: jfr-tck-${{ github.run_number }}
          path: .

      - name: Download persistence JFR recordings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jfr-persistence-${{ github.run_number }}
          path: .

      - name: Download benchmark JFR recordings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: jfr-benchmarks-*-${{ github.run_number }}
          path: .
          merge-multiple: true

      - name: Run JFR Reporter
        run: |
          jar=$(ls tools/jfr-reporter/target/jfr-reporter-*.jar 2>/dev/null | grep -v original | head -1)
          if [ -z "$jar" ]; then
            echo "ERROR: jfr-reporter shaded JAR not found in tools/jfr-reporter/target/" >&2
            exit 1
          fi
          java -jar "$jar" \
            --core      exeris-kernel-core/target/ \
            --community exeris-kernel-community/target/ \
            --commit    ${{ github.sha }} \
            --branch    ${{ github.ref_name }} \
            --out       build/jfr-report/

      - name: Upload Lab JSON
        uses: actions/upload-artifact@v4
        with:
          name: jfr-lab-json-${{ github.run_number }}
          path: build/jfr-report/
          if-no-files-found: warn
          retention-days: 30

  publish-gh-pages-data:
    name: Publish JFR Data → GH Pages
    runs-on: ubuntu-latest
    needs: [parse-jfr-to-json, benchmarks]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Lab JSON
        uses: actions/download-artifact@v4
        with:
          name: jfr-lab-json-${{ github.run_number }}
          path: build/jfr-report/

      - name: Download Community benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jmh-community-results
          path: build/jmh-results/community/

      - name: Download Core benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jmh-core-results
          path: build/jmh-results/core/

      - name: Publish latest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jfr-report/
          destination_dir: data/jfr/latest
          keep_files: true

      - name: Publish run snapshot to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jfr-report/
          destination_dir: data/jfr/${{ github.run_number }}
          keep_files: true

      - name: Publish JMH results latest to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jmh-results/
          destination_dir: data/jmh/latest
          keep_files: true

      - name: Publish JMH results snapshot to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jmh-results/
          destination_dir: data/jmh/${{ github.run_number }}
          keep_files: true
