name: Exeris L0 Citadel CI

on:
  # Push events trigger CI only on long-lived branches (main + RC trunks) — these
  # carry the SNAPSHOT publish responsibility. Feature branches under
  # development/feat/** are excluded here; they get validated once via the
  # pull_request event when a PR is opened. This avoids running every gate
  # twice on the same SHA (push + PR), which doubled GHA minutes and doubled
  # the flake chance on the Transport Stress Gate under 2-vCPU schedule
  # pressure (see v0.8 Sprint 1 CI hotfix v6 + Sprint 3 PR #133/#134).
  push:
    branches:
      - main
      - 'development/**'
      - '!development/feat/**'
  pull_request:
    branches: [ "main", "development/**" ]   # validate PRs targeting RC trunks before merge
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC on default branch (main)

env:
  # ADR-066 — the build baselines on JDK 25 LTS.
  #
  # --enable-preview is GONE, from the whole line: no source under this repository uses a preview
  # API any more, test fixtures included. This changed no published artifact — the TCK test-jar,
  # the only one built from test sources, measured 0 preview-stamped classes of 467 already, and
  # the 56 that were stamped sat in core/community test-classes, which are never published. What
  # it buys is the build itself: --enable-preview is legal only when --release equals the running
  # JDK, so the GA line could be built by JDK 25 and nothing else. Now any JDK >= 25 can build it.
  #
  # --enable-final-field-mutation was REMOVED, not overlooked: it is a JDK 26 flag (JEP 500
  # integrity-by-default) and JDK 25 refuses to start with it. There is nothing to re-enable on
  # 25, since that is the release the restriction has not reached yet.
  MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"
  JDK_URL: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4%2B7/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_7.tar.gz"
  JDK_SHA256: "e58fcdcd637b25c03ca84cbbcefc70d11efb8f4b4cbd05decc9f661769d77f94"
  JDK_CACHE_KEY: "jdk-25.0.4-7-linux-x64"
  JDK_VER: "25.0.4"

jobs:
  build-and-verify:
    name: Build & TCK Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GitHub Packages publish

    env:
      # Job-level so the guard on the analysis step can read it — `secrets` is not available in a
      # step-level `if`. Empty on forked PRs, which is exactly when the step must skip rather than fail.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute new code and blame; a shallow clone silently
          # degrades the new-code period into "everything".
          fetch-depth: 0

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Build & Run TCK Verification
        # v0.8 Sprint 7 (TCK-064 production fix): the VT-scheduler workaround
        # (parallelism=16 / maxPoolSize=64) was removed once client ingress became
        # non-blocking and reactor-driven. Previously the single-reactor
        # CommunityTransportCarrierPinningTckTest exhausted the default 2-thread VT
        # carrier pool because each client stream ran a VT that blocked in a native
        # recv() (FFM-pinned the carrier). Client channels now flip to non-blocking
        # after connect() and register on a dedicated client-side reactor, so no VT
        # blocks on recv() and the default carrier pool is sufficient. The drain
        # budget is restored toward the strict 5 s default; happy-path drain is
        # sub-second.
        #
        # v0.8 Sprint 6 (Coverage C-P0-01): -Pcoverage activates JaCoCo agent +
        # report + per-module <check> rule enforcement. Per-module LINE coverage
        # floors live in each module's <jacoco.line.minimum> property
        # (ratcheted ~5-9 pp below current baseline).
        run: |
          # -Dexeris.tck.transport.drainTimeoutSeconds: the transport carrier-pinning
          # TCK teardown drains queued native-TCP writes within a budget (default 5s,
          # tuned for fast local dev). The 2-vCPU GitHub runner is slower/contended, so
          # the multi-reactor pinning teardowns (e.g. CommunityTransportCarrierPinning*)
          # intermittently exceed 5s on cleanup — a CI-load artifact, not a pinning
          # defect. Raise the budget for CI only; the local default stays tight so it
          # still catches genuine drain regressions. (Mechanism documented in the
          # Transport Stress Gate notes below.)
          mvn clean verify -B -e \
            -P coverage \
            -Dexeris.tck.transport.drainTimeoutSeconds=30

      - name: Preview-Bytecode Gate
        # ADR-066. Reads the class files this build just produced and fails if anything the
        # project DISTRIBUTES carries a preview stamp (minor_version 0xFFFF) or targets a
        # class-file major above the declared LTS baseline.
        #
        # Placed here, in the job that already built the reactor, so it inspects real artifacts
        # rather than rebuilding them. It reads bytecode rather than sources deliberately: the
        # stamp is what a consumer trips over, it survives generated and processor-emitted code
        # that a grep would miss, and it cannot be satisfied by a comment claiming compliance.
        #
        # Test and TCK fixtures used to be out of scope, because they compiled with
        # --enable-preview and the shipped classes did not. They no longer use a preview API at
        # all, so the flag is gone from the build and there is nothing left for the scope to
        # exclude — the gate now describes the whole line rather than half of it.
        run: tools/preview-bytecode-scan/preview-bytecode-scan.sh --expect-major 69

      - name: Module-Name Gate
        # Every published jar must carry an Automatic-Module-Name. A jar without one is still
        # usable on the module path — the JDK derives a name from the FILE NAME — and that derived
        # name becomes a de-facto contract from the first release a consumer compiles against.
        # So the failure is silent here and expensive at the far end, which is what makes it a gate
        # rather than a convention.
        #
        # This step IS the guarantee, which was established by measurement rather than assumed: an
        # unset `exeris.module.name` does not fail the build. With the config inherited from the
        # root pluginManagement and no local plugin declaration, the property goes unresolved and
        # the manifest entry is simply omitted — the jar ships nameless and green. So the script
        # discovers every jar the reactor produced rather than checking a hand-maintained list,
        # because a new module would otherwise be uncovered by default.
        #
        # Placed in the job that already built the reactor, for the same reason the preview gate is:
        # it reads the artifacts rather than rebuilding them.
        run: tools/module-name-check/module-name-check.sh
      - name: Scope-Register Gate
        # Keeps docs/release/1.0-scope.md and docs/ROADMAP.md from drifting. The roadmap owns the
        # analysis and carries a `**1.0 disposition:**` per item; the register owns the state.
        # Nothing connected them, which is how an item can be dispositioned and then never tracked.
        #
        # Checks set equality of headings, not correctness of a recorded state -- nothing can check
        # the latter, and the register puts every state behind a named check or the word
        # `unverified` for exactly that reason.
        #
        # Docs-only, so it needs no build artifact; it sits here rather than in its own job because
        # a second checkout would cost more than the check.
        run: tools/scope-register-check/scope-register-check.sh
      - name: Error-Code Registry Gate
        # Keeps KernelErrorCodes and docs/subsystems/exceptions.md in agreement, both directions,
        # plus the single-source-of-truth rule the registry rests on.
        #
        # Nothing connected the two before, and the drift was not marginal: TWENTY of 84 codes had
        # no doc row, including four whole domains, and two main-source classes stamped an EX- code
        # as a bare string literal -- one of them a sentinel that was in no registry at all. None of
        # that failed anything; it was found by chasing a single missing row.
        #
        # Docs-and-sources only, so it needs no build artifact -- same reasoning as the gate above.
        run: tools/error-code-registry-check/error-code-registry-check.sh
      - name: Checkstyle Parity Gate
        # exeris-kernel-tck runs a second Checkstyle config, because its main sources are contract
        # tests. The PMD ruleset beside it can reference the kernel's and exclude from it, so it
        # stays a live view; Checkstyle has no config inheritance, so its TCK config is a copy and
        # the format offers no guarantee at all.
        #
        # The failure that copy invites is silent and one-directional: a module added to
        # checkstyle.xml stops short of ~130 classes, and nothing fails, because the TCK config is
        # by itself still valid. This gate compares the two module by module and property by
        # property against a delta the TCK config declares about itself.
        #
        # Config-only, so it needs no build artifact — same reasoning as the two gates above.
        run: tools/checkstyle-parity-check/checkstyle-parity-check.sh

      - name: Supply-Chain Gate
        # v0.12 Stream B. Two checks, deliberately at different ends of the build.
        #
        # `artifact:check-buildplan` reads the BUILD PLAN, so it fails on a newly added plugin that
        # cannot produce reproducible output before that plugin has published anything. It needs no
        # artifacts and would work on an empty target/; it is here rather than in its own job only
        # because a separate job would spend a JDK download on a five-second check.
        #
        # The SBOM gate reads the artifacts this job just built, same as the preview gate above. It
        # exists because the failure mode of an SBOM is a file that is present and wrong — empty
        # component list, stale version, restored random serial — and each of those reads as success
        # to anything that merely checks the file is there.
        #
        # Placed in the root job knowingly: every other job depends on this one, so a failure here
        # takes the pipeline down. That is correct for this gate and not for the Sonar step below —
        # the distinction is whether the failure is about the code under test. A plugin that breaks
        # reproducibility, or an SBOM that misdescribes the jar, is a change someone made in this
        # diff.
        run: |
          mvn -B org.apache.maven.plugins:maven-artifact-plugin:3.6.0:check-buildplan
          tools/sbom-gate/sbom-gate.sh

      - name: Upload SBOMs
        # Published beside each artifact by `mvn deploy` (classifier `cyclonedx`), so this upload is
        # not the distribution channel — it is what makes the SBOMs readable for a run that never
        # deploys, which is every pull request.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.run_number }}
          path: |
            target/bom.json
            exeris-kernel-*/target/bom.json
          if-no-files-found: warn
          retention-days: 30

      - name: SonarQube Cloud Analysis
        # Runs in this job, immediately after the build, so it consumes the compiled classes and the
        # JaCoCo XML that `-P coverage` just produced rather than rebuilding them. That reuse is the
        # whole point: SonarCloud Automatic Analysis never builds the project, so the
        # `sonar.coverage.jacoco.xmlReportPaths` in sonar-project.properties could never resolve and
        # coverage on new code read 0.0% on every pull request regardless of the tests written.
        #
        # Skipped when the secret is absent (forked pull requests) — a missing token must not fail
        # the build gate.
        #
        # continue-on-error, deliberately: this job is the ROOT of the entire pipeline — all eight
        # other jobs depend on it directly or transitively — so an unhealthy analysis step would take
        # down every merge gate for a reason unrelated to the code under test. Static analysis is not
        # a correctness gate here and must never be able to do that.
        #
        # The organisation now has an administrator, Automatic Analysis is off and the token is an
        # organisation secret, so this step runs for real. The first CI-based analysis this
        # repository has ever had is what settled several things that were guesses until then:
        # JaCoCo coverage imported (8 reports, and the `coverage` metric had not existed at all
        # before), the `sonar.issue.ignore` entries took effect where Automatic Analysis had been
        # ignoring them, and the TCK reclassification landed — 115 bugs and vulnerabilities closed,
        # 8 code smells left.
        #
        # That analysis also logged `Unresolved imports/types have been detected during analysis`
        # and `Missing 'sonar.java.test.libraries' property`, which is what moved this step from the
        # standalone CLI scanner to the Maven one. The CLI scanner has to be HANDED the analysis
        # classpath, and it was handed a glob over the project tree — which cannot reach the local
        # Maven repository, so it matched the 9 reactor jars and none of the 71 dependency jars on
        # a module's real test classpath. sonar-java was resolving neither JUnit nor AssertJ nor the
        # Postgres driver. The Maven plugin derives both properties per module from the reactor;
        # dumped locally before this change was made, exeris-kernel-community resolves to 26 main
        # and 71 test library entries.
        #
        # Half of the predicted outcome held: `Missing 'sonar.java.test.libraries'` is gone,
        # `Unresolved imports/types` is not. The empty classpath was therefore not its only cause,
        # and naming what is still unresolved needs a DEBUG run that has not been made.
        #
        # It also brings all ten reactor modules into scope, where sonar.sources had been a
        # hand-written list missing three of them whose JaCoCo reports were nonetheless imported
        # (18 x `File not found in project sources`, and that coverage discarded). What it does not
        # cover is tools/jfr-reporter, 6 files and 570 lines of CI tooling that sit outside the
        # reactor deliberately: the old list named it, this cannot, and adding it back to the root
        # module's sources would analyse it without its own dependencies, reintroducing the exact
        # defect being removed here.
        #
        # No third-party action any more, which also retires a SHA pin that existed because two
        # high-severity advisories (GHSA-f79p-9c5r-xg88, GHSA-5xq9-5g24-4g6f) covered every 4.x/5.x
        # release of `sonarqube-scan-action`. The plugin version is pinned in the root POM's
        # pluginManagement; the goal is invoked by full coordinates so the pin is what resolves,
        # rather than a prefix lookup that would take the newest release.
        continue-on-error: true
        if: ${{ env.SONAR_TOKEN != '' }}
        # No -Dsonar.verbose here, and that is a finding rather than an omission. The analyser
        # reports `Unresolved imports/types have been detected during analysis. Enable DEBUG mode to
        # see them` and names nothing; a run was made with `-Dsonar.verbose=true` to make it name
        # them, the property reached the scanner, and the log came back with ZERO DEBUG lines and
        # the identical unnamed warning. So that is not what raises the engine's log level under the
        # Maven bootstrapper, and repeating the probe would waste a second CI cycle the way it
        # wasted the first.
        #
        # What is known without it: the warning fires in every module that has compile dependencies
        # and not in exeris-kernel-spi, which has none, while `Use of preview features` fires in
        # every Java module INCLUDING that one. The preview half is answered outright by javac,
        # which at `--release 25` without `--enable-preview` refuses to compile a preview feature,
        # and by the preview-bytecode gate reading major 69 with no stamp. Both are most plausibly
        # the analyser's support level for a JDK released months before it.
        run: mvn -B -e org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Upload TCK JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-tck-${{ github.run_number }}
          path: |
            exeris-kernel-*/target/*.jfr
            exeris-kernel-*/target/jfr-reports/**/*.jfr
          if-no-files-found: warn
          retention-days: 14

      # Publish to GitHub Packages on push to main (release versions like 0.7.0) AND on push
      # to any RC trunk (development/0.8, development/0.9, ...) where the POM carries a
      # `-SNAPSHOT` qualifier. The same step handles both: Maven routes release versions to
      # <repository> and SNAPSHOTs to <snapshotRepository> (both pointing at GitHub Packages
      # in this repo, but the URL choice is Maven's, not the workflow's).
      #
      # GitHub Packages mutability:
      #   * Release versions are IMMUTABLE — a 409 on retry means the version is already
      #     published, which is not a real failure (covered by continue-on-error).
      #   * SNAPSHOTs are MUTABLE — every push to an RC trunk overwrites the previous
      #     SNAPSHOT artifact so downstream consumers (e.g. exeris-spring-runtime) always
      #     pull the latest RC trunk HEAD.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/development/'))
        continue-on-error: true
        run: |
          mvn deploy -B -e \
            --settings .github/maven-settings.xml \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spi-compatibility-gate:
    name: SPI Compatibility Gate
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: build-and-verify`. The gate compiles only exeris-kernel-spi
    # (which depends on nothing but java.*/jdk.*), so it finishes in well under a minute and
    # gives the fastest possible signal on a contract break — the one class of mistake that is
    # expensive to discover after a release rather than before one.
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags: the gate diffs the SPI at the last released tag against this
          # revision, and a shallow clone has neither.
          fetch-depth: 0

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Every SPI class resolves to a maturity label
        # Checked per class, not per package: inside a `mixed` package one matching
        # class would otherwise mark the whole directory classified, and the rest would
        # fall out of both include lists below — neither gated nor reported.
        run: tools/spi-api-diff/spi-api-diff.sh --verify-surfaces

      - name: Diff SPI against the last released version
        run: |
          set -euo pipefail
          # Highest released version, NOT `git describe`: patch releases are cut on main, so on a
          # development/* branch the last *reachable* tag can be older than the latest published
          # one. Reachability is irrelevant — this compares two API surfaces, not two histories.
          # Strict vMAJOR.MINOR.PATCH, not the bare `v*` glob this used to take. The glob picks the
          # highest tag matching a pattern, so any tag that lands inside it decides the baseline —
          # and `git tag --sort=-v:refname` sorts `v0.11.0-preview` ABOVE `v0.11.0` (measured). One
          # suffixed tag on the preview line would therefore have made THIS line diff its SPI
          # against a tree that is not its ancestor: value classes, StructuredTaskScope signatures,
          # a baseline that is garbage in either direction. The preview line tags `preview/vX.Y.Z`
          # for that reason, but a naming convention nobody can enforce is not a guard — this is.
          # `|| true` is load-bearing under `set -euo pipefail`, not defensive noise. grep exits 1
          # when it matches nothing, pipefail makes that the pipeline's status, and an assignment
          # from a failing command substitution aborts under -e — so without it the friendly
          # "no release tag found" branch below is UNREACHABLE and the job hard-fails instead. The
          # two-stage form the strict filter replaced never had the hazard: `head -1` exits 0 on an
          # empty stream. Adding grep as a third stage is what introduced it, in the same v0.12
          # change that added the filter.
          BASELINE="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -z "$BASELINE" ]; then
            echo "no release tag found — nothing to compare against"; exit 0
          fi
          echo "baseline: $BASELINE"
          tools/spi-api-diff/spi-api-diff.sh \
            --old "$BASELINE" --new HEAD \
            --out "${{ github.workspace }}/target/spi-api-diff" \
            --fail-on-stable

      - name: Publish SPI diff report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spi-api-diff
          path: target/spi-api-diff/
          if-no-files-found: warn

  persistence-rls-gate:
    name: Persistence RLS/Interceptor Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run persistence RLS integration gate
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            test -B -e

      - name: Upload persistence JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-persistence-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  kafka-integration-gate:
    # v0.8 Sprint 6 (Coverage C-P0-02 absorption): dedicated job that runs the
    # Kafka @Tag("integration") tests in exeris-kernel-community-kafka. The
    # module only configures Surefire (no Failsafe), and its default
    # <excludedGroups>integration</excludedGroups> drops the 3 IT-tests from
    # every reactor build:
    #   - CommunityKafkaEventEngineTckIT
    #   - CommunityKafkaFlowChoreographyTckIT
    #   - CommunityCrossEngineChoreographyIT
    # All three spin Testcontainers (Kafka + Postgres) and exercise the broker
    # path under real wire conditions. Without this gate they exist in tree
    # but never run on CI — coverage % is ~0% on the kafka subsystem.
    #
    # Mirrors persistence-rls-gate exactly: override -DincludedGroups=integration
    # and clear -DexcludedGroups= so Surefire picks them up.
    #
    # Sprint 3 cont. (CI sequencing): chains after persistence-rls-gate (not
    # parallel) so integration gates don't all kick off simultaneously. Order:
    # build-and-verify → persistence-rls-gate → kafka-integration-gate
    # → transport-stress-gate. Trades wall-clock for predictable scheduling.
    name: Kafka Integration Gate
    runs-on: ubuntu-latest
    needs: persistence-rls-gate
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run kafka integration gate
        run: |
          mvn -pl exeris-kernel-community-kafka -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community-kafka \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            test -B -e

      - name: Upload kafka JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-kafka-${{ github.run_number }}
          path: exeris-kernel-community-kafka/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  recovery-continuity-gate:
    # v0.9 Sprint 7: operational-continuity suite — @Tag("continuity") tests in
    # exeris-kernel-community + exeris-kernel-community-kafka. The default `Build & TCK
    # Verification` job excludes the continuity group (see <excludedGroups> in both poms)
    # because these are Testcontainers-backed (Postgres/Kafka) restart-recovery and
    # degraded-mode integration tests, too heavy for the default unit pass. This gate
    # overrides -DincludedGroups=continuity and clears -DexcludedGroups= so Surefire picks
    # them up — mirrors persistence-rls-gate / kafka-integration-gate exactly.
    #
    # Chains after kafka-integration-gate (sequencing isolates each gate's scheduler
    # pressure): build-and-verify → persistence-rls-gate → kafka-integration-gate →
    # recovery-continuity-gate → transport-stress-gate.
    name: Recovery Continuity Gate
    runs-on: ubuntu-latest
    needs: kafka-integration-gate
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run recovery/continuity gate
        run: |
          mvn -pl exeris-kernel-community,exeris-kernel-community-kafka -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community,exeris-kernel-community-kafka \
            -DincludedGroups=continuity \
            -DexcludedGroups= \
            test -B -e

      - name: Upload continuity JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-continuity-${{ github.run_number }}
          path: |
            exeris-kernel-community/target/*.jfr
            exeris-kernel-community-kafka/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  transport-stress-gate:
    # TCK-064 (v0.8 Sprint 0): dedicated job for @Tag("stress") transport tests.
    # The default `Build & TCK Verification` job excludes the stress group because the
    # constrained 2-vCPU GitHub Actions runner historically deadlocked under thread
    # pressure (see ROADMAP TCK-064). v0.8 Sprint 0 closed the deadlock by replacing
    # `Thread.onSpinWait()` busy-waits with `LockSupport.parkNanos` in client/server
    # echo loops and post-test verification deadlines (`NativeTcpTransportStressTest`).
    # The TCK pinning teardown now exposes a configurable drain budget via
    # `-Dexeris.tck.transport.drainTimeoutSeconds=N` for constrained runners.
    #
    # Sprint 3 cont. (CI sequencing): chains after kafka-integration-gate (last in
    # the integration-gate chain). Order: build-and-verify → persistence-rls-gate
    # → kafka-integration-gate → transport-stress-gate. Sequencing isolates each
    # gate's scheduler pressure — no two stress-prone jobs run simultaneously.
    name: Transport Stress Gate
    runs-on: ubuntu-latest
    needs: recovery-continuity-gate
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run transport stress gate
        # v0.8 Sprint 7 (TCK-064 production fix): the VT-scheduler workaround and the
        # 180 s drain escalation were removed. TCK-064's root cause was client ingress
        # VTs blocking in a native recv() via Panama FFM, which pinned the carrier
        # thread; on a 2-vCPU runner (default carrier pool = 2) a handful of clients
        # exhausted the pool and stalled. The Sprint 7 fix makes client channels
        # non-blocking after connect() and reactor-driven (no VT blocks on recv()), so
        # the stress + multi-reactor variants pass at the default carrier pool with the
        # strict drain budget. The MultiReactor{2,4} variants stay @Tag("stress") and
        # run here; the single-reactor baseline runs in build-and-verify.
        #
        # v0.9 Sprint 4c: under peak 2-vCPU scheduler pressure the MultiReactor4
        # teardown drain still occasionally exceeds the strict 5 s default (the reactor
        # key release that ends hasPendingData() queues behind the test thread). The
        # configurable drain budget is widened to 30 s here to match build-and-verify —
        # the contract stays strict locally (>= 4 cores), CI gets the constrained-runner
        # window. This is a runner-pressure accommodation, not a relaxed contract.
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=stress \
            -DexcludedGroups= \
            -Dexeris.tck.transport.drainTimeoutSeconds=30 \
            test -B -e

      - name: Upload transport stress JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-transport-stress-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  tls-openssl-matrix:
    # v0.9 Sprint 4b (OpenSSL 4.0 migration): proves the crypto/TLS stack against BOTH
    # supported OpenSSL majors. CoreOpenSslLoader now binds SSL_CTX_new_ex unconditionally
    # and accepts the band 3.x..4.x; this matrix pins each major from a source build and
    # forces the TLS tests to HARD-RUN against it (no assumeTrue skip — the pinned lib is
    # present, so a skip here would be a silent gap).
    #
    # The env overrides EXERIS_OPENSSL_SSL_PATH / EXERIS_OPENSSL_CRYPTO_PATH bypass the
    # candidate ordering for deterministic per-major selection. N = SONAME major (3 or 4).
    #
    # CACHE KEY (the #1 false-green risk): the key embeds the exact OpenSSL version AND a
    # hash of the literal configure flags. A stale cache serving an old 3.x to the 4.0 entry
    # would make the 4.0 job pass against 3.x — a false green. Bumping the version or the
    # flags invalidates the cache automatically.
    name: TLS OpenSSL ${{ matrix.openssl_version }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssl_version: "3.5.6"
            openssl_tag: "openssl-3.5.6"
            soname_major: "3"
          - openssl_version: "4.0.0"
            openssl_tag: "openssl-4.0.0"
            soname_major: "4"

    env:
      # Literal configure flags — also fed into the cache key hash so a flag change busts it.
      OPENSSL_CONFIGURE_FLAGS: "no-tests no-docs --openssldir=/opt/openssl-${{ matrix.openssl_version }}/ssl"
      OPENSSL_PREFIX: "/opt/openssl-${{ matrix.openssl_version }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Cache OpenSSL ${{ matrix.openssl_version }} build
        id: openssl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          # Key embeds the EXACT version + a hash of the literal configure flags string.
          # A stale 3.x cache cannot satisfy the 4.0.0 entry: the version differs, so the
          # key differs, so the cache misses and a fresh 4.0.0 is built.
          key: openssl-${{ matrix.openssl_version }}-${{ hashFiles('.github/workflows/maven.yml') }}-v1-${{ env.OPENSSL_CONFIGURE_FLAGS }}

      - name: Build OpenSSL ${{ matrix.openssl_version }} from source
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ matrix.openssl_tag }}" \
            https://github.com/openssl/openssl openssl-src
          cd openssl-src
          ./Configure --prefix="${{ env.OPENSSL_PREFIX }}" --libdir=lib64 \
            ${{ env.OPENSSL_CONFIGURE_FLAGS }}
          make -j"$(nproc)"
          make install_sw
          # Fail-fast sanity: confirm the SONAME major actually built matches the matrix.
          test -f "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          test -f "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"

      - name: Verify pinned OpenSSL SONAME
        run: |
          set -euo pipefail
          ls -l "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          ls -l "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"

      - name: Install kernel artifacts for OpenSSL ${{ matrix.openssl_version }}
        run: |
          mvn -pl exeris-kernel-core,exeris-kernel-community -am install -DskipTests -B -e

      # ---------------------------------------------------------------------------
      # MERGE-GATE INTEGRITY NOTE (v0.9 Sprint 4b hardening, finding #1):
      # The crypto/TLS selection is SPLIT into three explicit invocations rather than
      # one shared `-DincludedGroups=integration` call. That single-call form only
      # worked by accident: `<groups>${includedGroups}</groups>` is wired ONLY in
      # exeris-kernel-community/pom.xml (+ kafka), NOT in core/parent/root. So in core
      # the flag was a no-op (the untagged Core* guards ran via -Dtest), while in
      # community only @Tag("integration") ran. If someone later standardized surefire
      # by adding <groups>${includedGroups}</groups> to parent/core, the flag would
      # suddenly EXCLUDE every untagged core test — including the
      # CoreOpenSslPinnedVersionAssertionTest 4.0-vs-fallback-3.x false-green guard.
      # The split removes that dependency on the undeclared pom asymmetry: the core
      # guards run as plain Surefire selection (no group flags), the loopback IT runs
      # via Failsafe (verify phase), and the community @Tag("integration") loopback
      # runs with the group flag scoped to the one module that honors it.
      # ---------------------------------------------------------------------------
      - name: Run core crypto/TLS guards against OpenSSL ${{ matrix.openssl_version }}
        # HARD-RUN: the pinned lib is present and selected via env override, so the
        # assumeTrue guards in these suites do not trigger — any skip would be a real gap.
        # These are UNTAGGED Surefire tests selected purely by -Dtest (NO group flags):
        # core Surefire deliberately does NOT honor includedGroups (see merge-gate note).
        #
        # -Dexeris.test.expectedOpenSslMajor pins the SONAME major so
        # CoreOpenSslPinnedVersionAssertionTest hard-proves the JVM actually bound the intended
        # major. Without it, an env-path miss would silently fall back to the host's system 3.x
        # and the 4.0 matrix entry would false-green. The test SKIPS when the property is unset
        # (local dev), so it is harmless outside this matrix.
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-core \
            -Dexeris.test.expectedOpenSslMajor=${{ matrix.soname_major }} \
            -Dtest='CoreOpenSslRuntimeTest,CoreOpenSslVersionGateTest,CoreOpenSslPinnedVersionAssertionTest,OpenSslLoadEventTest,CoreOffHeapTlsEngineTckTest,CoreOffHeapTlsEngineZeroAllocTckTest' \
            test -B -e

      - name: Run core TLS loopback IT against OpenSSL ${{ matrix.openssl_version }}
        # Belt-and-braces end-to-end proof (finding #2): the loopback IT is a Failsafe
        # test (**/*IT.java, integration-test/verify phase). It was previously listed
        # under `-Dtest` on a `test`-phase invocation, so it NEVER ran. Run it explicitly
        # via the verify phase + -Dit.test so the full SSL_accept/SSL_connect round-trip
        # is exercised against each pinned major. The assumeTrue OpenSSL guard does not
        # skip here because the pinned lib is present via the env override.
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-core \
            -Dsurefire.skip=true \
            -Dit.test=OffHeapTlsEngineLoopbackIT \
            verify -B -e

      - name: Run community TLS loopback integration against OpenSSL ${{ matrix.openssl_version }}
        # Community @Tag("integration") loopback — the group flag is scoped to the one
        # module whose pom wires <groups>${includedGroups}</groups>, so it behaves as
        # intended here (unlike the cross-module single-call form).
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-community \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            -Dtest='CommunityTlsEngineLoopbackIntegrationTest' \
            test -B -e

      - name: Upload OpenSSL ${{ matrix.openssl_version }} TLS JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jfr-tls-openssl-${{ matrix.openssl_version }}-${{ github.run_number }}
          path: exeris-kernel-*/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  benchmarks:
    name: JMH Benchmarks (Community + Core)
    # TODO: point runs-on to a dedicated bare-metal runner when available
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run JMH Benchmarks
        run: |
          mvn -pl exeris-kernel-community,exeris-kernel-core -am install -DskipTests -B -e
          mkdir -p exeris-kernel-community/target/jfr-reports exeris-kernel-core/target/jfr-reports
          mvn -pl exeris-kernel-community -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -DskipTests -B -e
          mvn -pl exeris-kernel-core -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -DskipTests -B -e

      - name: Upload Community benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
