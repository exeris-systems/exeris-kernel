name: Exeris L0 Citadel CI

on:
  # Push events trigger CI only on long-lived branches (main + RC trunks) — these
  # carry the SNAPSHOT publish responsibility. Feature branches under
  # development/feat/** are excluded here; they get validated once via the
  # pull_request event when a PR is opened. This avoids running every gate
  # twice on the same SHA (push + PR), which doubled GHA minutes and doubled
  # the flake chance on the Transport Stress Gate under 2-vCPU schedule
  # pressure (see v0.8 Sprint 1 CI hotfix v6 + Sprint 3 PR #133/#134).
  push:
    branches:
      - main
      - 'development/**'
      - '!development/feat/**'
  pull_request:
    branches: [ "main", "development/**" ]   # validate PRs targeting RC trunks before merge
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC on default branch (main)

env:
  MAVEN_OPTS: "--enable-preview --enable-final-field-mutation=ALL-UNNAMED --enable-native-access=ALL-UNNAMED"
  JDK_URL: "https://download.java.net/java/GA/jdk26/c3cc523845074aa0af4f5e1e1ed4151d/35/GPL/openjdk-26_linux-x64_bin.tar.gz"
  JDK_SHA256: "83c78367f8c81257beef72aca4bbbf8e6dac8ca2b3a4546a85879a09e6e4e128"
  JDK_CACHE_KEY: "jdk-26-b35-linux-x64"
  JDK_VER: "26.0.0"

jobs:
  build-and-verify:
    name: Build & TCK Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GitHub Packages publish

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Build & Run TCK Verification
        # v0.8 Sprint 7 (TCK-064 production fix): the VT-scheduler workaround
        # (parallelism=16 / maxPoolSize=64) was removed once client ingress became
        # non-blocking and reactor-driven. Previously the single-reactor
        # CommunityTransportCarrierPinningTckTest exhausted the default 2-thread VT
        # carrier pool because each client stream ran a VT that blocked in a native
        # recv() (FFM-pinned the carrier). Client channels now flip to non-blocking
        # after connect() and register on a dedicated client-side reactor, so no VT
        # blocks on recv() and the default carrier pool is sufficient. The drain
        # budget is restored toward the strict 5 s default; happy-path drain is
        # sub-second.
        #
        # v0.8 Sprint 6 (Coverage C-P0-01): -Pcoverage activates JaCoCo agent +
        # report + per-module <check> rule enforcement. Per-module LINE coverage
        # floors live in each module's <jacoco.line.minimum> property
        # (ratcheted ~5-9 pp below current baseline).
        run: |
          mvn clean verify -B -e \
            -P coverage

      - name: Upload TCK JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-tck-${{ github.run_number }}
          path: |
            exeris-kernel-*/target/*.jfr
            exeris-kernel-*/target/jfr-reports/**/*.jfr
          if-no-files-found: warn
          retention-days: 14

      # Publish to GitHub Packages on push to main (release versions like 0.7.0) AND on push
      # to any RC trunk (development/0.8, development/0.9, ...) where the POM carries a
      # `-SNAPSHOT` qualifier. The same step handles both: Maven routes release versions to
      # <repository> and SNAPSHOTs to <snapshotRepository> (both pointing at GitHub Packages
      # in this repo, but the URL choice is Maven's, not the workflow's).
      #
      # GitHub Packages mutability:
      #   * Release versions are IMMUTABLE — a 409 on retry means the version is already
      #     published, which is not a real failure (covered by continue-on-error).
      #   * SNAPSHOTs are MUTABLE — every push to an RC trunk overwrites the previous
      #     SNAPSHOT artifact so downstream consumers (e.g. exeris-spring-runtime) always
      #     pull the latest RC trunk HEAD.
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/development/'))
        continue-on-error: true
        run: |
          mvn deploy -B -e \
            --settings .github/maven-settings.xml \
            -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  persistence-rls-gate:
    name: Persistence RLS/Interceptor Gate
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run persistence RLS integration gate
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            test -B -e

      - name: Upload persistence JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-persistence-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  kafka-integration-gate:
    # v0.8 Sprint 6 (Coverage C-P0-02 absorption): dedicated job that runs the
    # Kafka @Tag("integration") tests in exeris-kernel-community-kafka. The
    # module only configures Surefire (no Failsafe), and its default
    # <excludedGroups>integration</excludedGroups> drops the 3 IT-tests from
    # every reactor build:
    #   - CommunityKafkaEventEngineTckIT
    #   - CommunityKafkaFlowChoreographyTckIT
    #   - CommunityCrossEngineChoreographyIT
    # All three spin Testcontainers (Kafka + Postgres) and exercise the broker
    # path under real wire conditions. Without this gate they exist in tree
    # but never run on CI — coverage % is ~0% on the kafka subsystem.
    #
    # Mirrors persistence-rls-gate exactly: override -DincludedGroups=integration
    # and clear -DexcludedGroups= so Surefire picks them up.
    #
    # Sprint 3 cont. (CI sequencing): chains after persistence-rls-gate (not
    # parallel) so integration gates don't all kick off simultaneously. Order:
    # build-and-verify → persistence-rls-gate → kafka-integration-gate
    # → transport-stress-gate. Trades wall-clock for predictable scheduling.
    name: Kafka Integration Gate
    runs-on: ubuntu-latest
    needs: persistence-rls-gate
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run kafka integration gate
        run: |
          mvn -pl exeris-kernel-community-kafka -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community-kafka \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            test -B -e

      - name: Upload kafka JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-kafka-${{ github.run_number }}
          path: exeris-kernel-community-kafka/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  transport-stress-gate:
    # TCK-064 (v0.8 Sprint 0): dedicated job for @Tag("stress") transport tests.
    # The default `Build & TCK Verification` job excludes the stress group because the
    # constrained 2-vCPU GitHub Actions runner historically deadlocked under thread
    # pressure (see ROADMAP TCK-064). v0.8 Sprint 0 closed the deadlock by replacing
    # `Thread.onSpinWait()` busy-waits with `LockSupport.parkNanos` in client/server
    # echo loops and post-test verification deadlines (`NativeTcpTransportStressTest`).
    # The TCK pinning teardown now exposes a configurable drain budget via
    # `-Dexeris.tck.transport.drainTimeoutSeconds=N` for constrained runners.
    #
    # Sprint 3 cont. (CI sequencing): chains after kafka-integration-gate (last in
    # the integration-gate chain). Order: build-and-verify → persistence-rls-gate
    # → kafka-integration-gate → transport-stress-gate. Sequencing isolates each
    # gate's scheduler pressure — no two stress-prone jobs run simultaneously.
    name: Transport Stress Gate
    runs-on: ubuntu-latest
    needs: kafka-integration-gate
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run transport stress gate
        # v0.8 Sprint 7 (TCK-064 production fix): the VT-scheduler workaround and the
        # 180 s drain escalation were removed. TCK-064's root cause was client ingress
        # VTs blocking in a native recv() via Panama FFM, which pinned the carrier
        # thread; on a 2-vCPU runner (default carrier pool = 2) a handful of clients
        # exhausted the pool and stalled. The Sprint 7 fix makes client channels
        # non-blocking after connect() and reactor-driven (no VT blocks on recv()), so
        # the stress + multi-reactor variants pass at the default carrier pool with the
        # strict drain budget. The MultiReactor{2,4} variants stay @Tag("stress") and
        # run here; the single-reactor baseline runs in build-and-verify.
        run: |
          mvn -pl exeris-kernel-community -am install -DskipTests -B -e
          mvn -pl exeris-kernel-community \
            -DincludedGroups=stress \
            -DexcludedGroups= \
            test -B -e

      - name: Upload transport stress JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-transport-stress-${{ github.run_number }}
          path: exeris-kernel-community/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  tls-openssl-matrix:
    # v0.9 Sprint 4b (OpenSSL 4.0 migration): proves the crypto/TLS stack against BOTH
    # supported OpenSSL majors. CoreOpenSslLoader now binds SSL_CTX_new_ex unconditionally
    # and accepts the band 3.x..4.x; this matrix pins each major from a source build and
    # forces the TLS tests to HARD-RUN against it (no assumeTrue skip — the pinned lib is
    # present, so a skip here would be a silent gap).
    #
    # The env overrides EXERIS_OPENSSL_SSL_PATH / EXERIS_OPENSSL_CRYPTO_PATH bypass the
    # candidate ordering for deterministic per-major selection. N = SONAME major (3 or 4).
    #
    # CACHE KEY (the #1 false-green risk): the key embeds the exact OpenSSL version AND a
    # hash of the literal configure flags. A stale cache serving an old 3.x to the 4.0 entry
    # would make the 4.0 job pass against 3.x — a false green. Bumping the version or the
    # flags invalidates the cache automatically.
    name: TLS OpenSSL ${{ matrix.openssl_version }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - openssl_version: "3.5.6"
            openssl_tag: "openssl-3.5.6"
            soname_major: "3"
          - openssl_version: "4.0.0"
            openssl_tag: "openssl-4.0.0"
            soname_major: "4"

    env:
      # Literal configure flags — also fed into the cache key hash so a flag change busts it.
      OPENSSL_CONFIGURE_FLAGS: "no-tests no-docs --openssldir=/opt/openssl-${{ matrix.openssl_version }}/ssl"
      OPENSSL_PREFIX: "/opt/openssl-${{ matrix.openssl_version }}"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Cache OpenSSL ${{ matrix.openssl_version }} build
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENSSL_PREFIX }}
          # Key embeds the EXACT version + a hash of the literal configure flags string.
          # A stale 3.x cache cannot satisfy the 4.0.0 entry: the version differs, so the
          # key differs, so the cache misses and a fresh 4.0.0 is built.
          key: openssl-${{ matrix.openssl_version }}-${{ hashFiles('.github/workflows/maven.yml') }}-v1-${{ env.OPENSSL_CONFIGURE_FLAGS }}

      - name: Build OpenSSL ${{ matrix.openssl_version }} from source
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ matrix.openssl_tag }}" \
            https://github.com/openssl/openssl openssl-src
          cd openssl-src
          ./Configure --prefix="${{ env.OPENSSL_PREFIX }}" --libdir=lib64 \
            ${{ env.OPENSSL_CONFIGURE_FLAGS }}
          make -j"$(nproc)"
          make install_sw
          # Fail-fast sanity: confirm the SONAME major actually built matches the matrix.
          test -f "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          test -f "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"

      - name: Verify pinned OpenSSL SONAME
        run: |
          set -euo pipefail
          ls -l "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          ls -l "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"

      - name: Install kernel artifacts for OpenSSL ${{ matrix.openssl_version }}
        run: |
          mvn -pl exeris-kernel-core,exeris-kernel-community -am install -DskipTests -B -e

      # ---------------------------------------------------------------------------
      # MERGE-GATE INTEGRITY NOTE (v0.9 Sprint 4b hardening, finding #1):
      # The crypto/TLS selection is SPLIT into three explicit invocations rather than
      # one shared `-DincludedGroups=integration` call. That single-call form only
      # worked by accident: `<groups>${includedGroups}</groups>` is wired ONLY in
      # exeris-kernel-community/pom.xml (+ kafka), NOT in core/parent/root. So in core
      # the flag was a no-op (the untagged Core* guards ran via -Dtest), while in
      # community only @Tag("integration") ran. If someone later standardized surefire
      # by adding <groups>${includedGroups}</groups> to parent/core, the flag would
      # suddenly EXCLUDE every untagged core test — including the
      # CoreOpenSslPinnedVersionAssertionTest 4.0-vs-fallback-3.x false-green guard.
      # The split removes that dependency on the undeclared pom asymmetry: the core
      # guards run as plain Surefire selection (no group flags), the loopback IT runs
      # via Failsafe (verify phase), and the community @Tag("integration") loopback
      # runs with the group flag scoped to the one module that honors it.
      # ---------------------------------------------------------------------------
      - name: Run core crypto/TLS guards against OpenSSL ${{ matrix.openssl_version }}
        # HARD-RUN: the pinned lib is present and selected via env override, so the
        # assumeTrue guards in these suites do not trigger — any skip would be a real gap.
        # These are UNTAGGED Surefire tests selected purely by -Dtest (NO group flags):
        # core Surefire deliberately does NOT honor includedGroups (see merge-gate note).
        #
        # -Dexeris.test.expectedOpenSslMajor pins the SONAME major so
        # CoreOpenSslPinnedVersionAssertionTest hard-proves the JVM actually bound the intended
        # major. Without it, an env-path miss would silently fall back to the host's system 3.x
        # and the 4.0 matrix entry would false-green. The test SKIPS when the property is unset
        # (local dev), so it is harmless outside this matrix.
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-core \
            -Dexeris.test.expectedOpenSslMajor=${{ matrix.soname_major }} \
            -Dtest='CoreOpenSslRuntimeTest,CoreOpenSslVersionGateTest,CoreOpenSslPinnedVersionAssertionTest,OpenSslLoadEventTest,CoreOffHeapTlsEngineTckTest,CoreOffHeapTlsEngineZeroAllocTckTest' \
            test -B -e

      - name: Run core TLS loopback IT against OpenSSL ${{ matrix.openssl_version }}
        # Belt-and-braces end-to-end proof (finding #2): the loopback IT is a Failsafe
        # test (**/*IT.java, integration-test/verify phase). It was previously listed
        # under `-Dtest` on a `test`-phase invocation, so it NEVER ran. Run it explicitly
        # via the verify phase + -Dit.test so the full SSL_accept/SSL_connect round-trip
        # is exercised against each pinned major. The assumeTrue OpenSSL guard does not
        # skip here because the pinned lib is present via the env override.
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-core \
            -Dsurefire.skip=true \
            -Dit.test=OffHeapTlsEngineLoopbackIT \
            verify -B -e

      - name: Run community TLS loopback integration against OpenSSL ${{ matrix.openssl_version }}
        # Community @Tag("integration") loopback — the group flag is scoped to the one
        # module whose pom wires <groups>${includedGroups}</groups>, so it behaves as
        # intended here (unlike the cross-module single-call form).
        env:
          EXERIS_OPENSSL_SSL_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libssl.so.${{ matrix.soname_major }}"
          EXERIS_OPENSSL_CRYPTO_PATH: "${{ env.OPENSSL_PREFIX }}/lib64/libcrypto.so.${{ matrix.soname_major }}"
        run: |
          mvn -pl exeris-kernel-community \
            -DincludedGroups=integration \
            -DexcludedGroups= \
            -Dtest='CommunityTlsEngineLoopbackIntegrationTest' \
            test -B -e

      - name: Upload OpenSSL ${{ matrix.openssl_version }} TLS JFR recordings
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jfr-tls-openssl-${{ matrix.openssl_version }}-${{ github.run_number }}
          path: exeris-kernel-*/target/*.jfr
          if-no-files-found: warn
          retention-days: 14

  benchmarks:
    name: JMH Benchmarks (Community + Core)
    # TODO: point runs-on to a dedicated bare-metal runner when available
    runs-on: ubuntu-latest
    needs: build-and-verify
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Run JMH Benchmarks
        run: |
          mvn -pl exeris-kernel-community,exeris-kernel-core -am install -DskipTests -B -e
          mkdir -p exeris-kernel-community/target/jfr-reports exeris-kernel-core/target/jfr-reports
          mvn -pl exeris-kernel-community -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -B -e
          mvn -pl exeris-kernel-core -P benchmarks \
            -Dbenchmark.forks=1 \
            -Dbenchmark.warmup=3 \
            -Dbenchmark.iterations=5 \
            -Dbenchmark.warmuptime=1s \
            -Dbenchmark.iterationstime=1s \
            -Dbenchmark.jvmArgsAppend=-XX:StartFlightRecording=name=jmh,filename=target/jfr-reports/jmh-benchmarks.jfr,dumponexit=true,settings=default \
            verify -B -e

      - name: Upload Community benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-community-results
          path: exeris-kernel-community/target/jmh-results.json
          if-no-files-found: warn

      - name: Upload Core benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-core-results
          path: exeris-kernel-core/target/jmh-results.json
          if-no-files-found: warn

      - name: Upload Community benchmark JFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-benchmarks-community-${{ github.run_number }}
          path: exeris-kernel-community/target/jfr-reports/jmh-benchmarks.jfr
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Core benchmark JFR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jfr-benchmarks-core-${{ github.run_number }}
          path: exeris-kernel-core/target/jfr-reports/jmh-benchmarks.jfr
          if-no-files-found: warn
          retention-days: 14

  parse-jfr-to-json:
    name: Parse JFR → Lab JSON
    runs-on: ubuntu-latest
    needs: [build-and-verify, persistence-rls-gate, benchmarks]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache JDK tarball
        id: jdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/jdk.tar.gz
          key: ${{ env.JDK_CACHE_KEY }}

      - name: Fetch JDK
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q -O ${{ runner.temp }}/jdk.tar.gz ${{ env.JDK_URL }}
          echo "${{ env.JDK_SHA256 }}  ${{ runner.temp }}/jdk.tar.gz" | sha256sum -c

      - name: Inject JDK into Runner
        uses: actions/setup-java@v5
        with:
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/jdk.tar.gz
          java-version: ${{ env.JDK_VER }}
          architecture: x64
          cache: maven

      - name: Build JFR Reporter
        run: mvn -f tools/jfr-reporter/pom.xml clean package -q

      - name: Download TCK JFR recordings
        uses: actions/download-artifact@v4
        with:
          name: jfr-tck-${{ github.run_number }}
          path: .

      - name: Download persistence JFR recordings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jfr-persistence-${{ github.run_number }}
          path: .

      - name: Download benchmark JFR recordings
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: jfr-benchmarks-*-${{ github.run_number }}
          path: .
          merge-multiple: true

      - name: Run JFR Reporter
        run: |
          jar=$(ls tools/jfr-reporter/target/jfr-reporter-*.jar 2>/dev/null | grep -v original | head -1)
          if [ -z "$jar" ]; then
            echo "ERROR: jfr-reporter shaded JAR not found in tools/jfr-reporter/target/" >&2
            exit 1
          fi
          java -jar "$jar" \
            --core      exeris-kernel-core/target/ \
            --community exeris-kernel-community/target/ \
            --commit    ${{ github.sha }} \
            --branch    ${{ github.ref_name }} \
            --out       build/jfr-report/

      - name: Upload Lab JSON
        uses: actions/upload-artifact@v4
        with:
          name: jfr-lab-json-${{ github.run_number }}
          path: build/jfr-report/
          if-no-files-found: warn
          retention-days: 30

  publish-gh-pages-data:
    name: Publish JFR Data → GH Pages
    runs-on: ubuntu-latest
    needs: [parse-jfr-to-json, benchmarks]
    if: (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Lab JSON
        uses: actions/download-artifact@v4
        with:
          name: jfr-lab-json-${{ github.run_number }}
          path: build/jfr-report/

      - name: Download Community benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jmh-community-results
          path: build/jmh-results/community/

      - name: Download Core benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: jmh-core-results
          path: build/jmh-results/core/

      - name: Publish latest to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jfr-report/
          destination_dir: data/jfr/latest
          keep_files: true

      - name: Publish run snapshot to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jfr-report/
          destination_dir: data/jfr/${{ github.run_number }}
          keep_files: true

      - name: Publish JMH results latest to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jmh-results/
          destination_dir: data/jmh/latest
          keep_files: true

      - name: Publish JMH results snapshot to GitHub Pages
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/jmh-results/
          destination_dir: data/jmh/${{ github.run_number }}
          keep_files: true
