# The issue-side footprint of issue-conventions.md rules 3 and 5.
#
# Separate from guardrails.yml because it is not pull-request-triggered and needs `issues: write`,
# which the pull-request gates deliberately do not have. The label sync is additive — it adds the
# organisation taxonomy and never deletes — so this repository keeps its own `layer:` and `area:`
# labels, which no other repository has.
name: issues
on:
  schedule:
    - cron: "17 4 * * 1"     # Monday, early. Label drift and stale evidence are not urgent.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Report label changes without making them"
        type: boolean
        default: false
permissions:
  issues: write

# Pinned by commit SHA, like every other `uses:` in this repository — `dependabot.yml` explains
# why: a SHA is immune to a moved tag but invisible to a reader, and Dependabot is what keeps it
# current, rewriting the SHA and the trailing comment together. SonarCloud enforces the same rule
# and it is a required check here.
#
# The trailing comment names the ref the SHA came from, not a version and not a date. That
# repository publishes no tags and no releases, so there is no version to name; and a date would
# rot, because Dependabot updates a version comment by finding the PREVIOUS VERSION STRING in it
# and replacing that (dependabot-core#5951) — it has no rule for a date, so the SHA would move and
# the date would not. `@main` stays true whichever commit the SHA is.
#
# Whether Dependabot bumps these at all is worth watching on the first weekly run: it does cover
# reusable-workflow `uses:` (GitHub docs), and for a SHA with no tag behind it, it moves the pin to
# the branch HEAD (dependabot-core#13466, #14716) — which is the behaviour wanted here. Both are
# reports about other people's repositories, not something observed in this one.

jobs:
  labels:
    uses: exeris-systems/.github/.github/workflows/labels-sync.yml@1d9a445a79513fa4692297f5d1b43892c2269ed9 # exeris-systems/.github@main
    with:
      dry-run: ${{ inputs.dry-run == true }}
  hygiene:
    uses: exeris-systems/.github/.github/workflows/issue-hygiene.yml@1d9a445a79513fa4692297f5d1b43892c2269ed9 # exeris-systems/.github@main
