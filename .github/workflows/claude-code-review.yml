name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. `synchronize` fires on every push, so without this a
# quick follow-up push leaves two full reviews running against different commits —
# the older one finishes and posts a verdict on code that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts and dependency bumps do not need a full review pass. Draft PRs still
    # fire `opened`, and a bot PR would otherwise be reviewed once per push.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Permissions:
    #   - `pull-requests: write` is required so Claude can actually post the review
    #     (without it the action runs and produces no visible output).
    #   - `contents: read` is enough — the review job does not push commits.
    #   - `id-token: write` is required for the action's OIDC-based app-token exchange.
    #
    # Pattern mirrors `exeris-tooling` / `exeris-spring-runtime` (the canonical Exeris
    # setup that delivers reviews end-to-end). The previous variant of this file used
    # `plugin_marketplaces` + `plugins: code-review@claude-code-plugins`, which ran
    # cleanly but never posted comments — the plugin path does not enable the
    # comment-posting MCP tools by default. The inline-prompt path with an explicit
    # `--allowedTools` allow-list does. See `claude_args` below.
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          # The review criteria are NOT authored here. They were — eighty-seven lines of them —
          # and that made this file the third place the same rules lived, after AGENTS.md and
          # .agents/policies/. Measured before removing it: the inline prompt named ONE of this
          # repository's eight policies and omitted EIGHT of the ten mechanical gates CI actually
          # runs, including `coreDoesNotDependOnCommunity` and every tagged gate. A rule added to a
          # policy never reached the reviewer, and a rule edited here diverged in silence.
          #
          # `agents_file_check.py` cannot see this: .github/workflows is operational configuration
          # and exempt from the adapter check by design, so rule 2 binds here at review level only.
          # That is why it went unnoticed through the v2 migration itself.
          #
          # The action checks the repository out, so the routine, the role it names and the scripts
          # both name are on disk. This prompt's whole job is to say which one to run.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Review this pull request by running the repository's own review routine.

            1. Read `AGENTS.md`. It is the entry point and it names where the rules live.
            2. Read `.agents/workflows/kernel-pr-review.md` and follow it, acting as the
               `exeris-evaluator` role in `.agents/agents/exeris-evaluator/AGENT.md`.
               Read the policies, subsystem contracts and nested `AGENTS.md` those two files
               name — the ones your diff actually touches — rather than working from memory.
               Each is the single owner of its list.
            3. Run the mechanical checks that routine's table earns for this diff, and report
               each as pass, fail or not-run with its exit code. A check you could not run is
               reported as not-run, never omitted.

            The base branch above decides which distribution track applies, and the same code can
            be correct on one and disqualifying on the other. Establish it before applying any
            rule that mentions preview features.

            Post one PR review, not many separate comments. Lead with blockers, then in-scope
            improvements, then non-blocking suggestions, citing `file:line`. End with the verdict
            and, after it, the same content as a fenced `json` block conforming to
            `.agents/schemas/verdict.schema.json`.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(tools/spi-contract-blindness-check/spi-contract-blindness-check.sh:*),Bash(tools/error-code-registry-check/error-code-registry-check.sh:*),Bash(tools/checkstyle-parity-check/checkstyle-parity-check.sh:*),Bash(tools/scope-register-check/scope-register-check.sh:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(git remote:*)"
