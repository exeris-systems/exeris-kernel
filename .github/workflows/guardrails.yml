# The per-repo footprint of ADR-085 §C.11. Everything it runs lives in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# Nothing in the repository ran these before: the documentation standards were binding but
# unenforced, and the L2 documentation review existed only inside a Cowork session, so a pull
# request could contradict a standard and merge green.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares — not a wish list. Omitting the last two is what
# made the first push of this file an invalid workflow: "requesting 'issues: read, id-token: write',
# but is only allowed 'issues: none, id-token: none'".
#
# Granting them here does not widen docs-lint, commit-lint or pr-body-check: a called workflow's
# jobs receive what its OWN permissions block declares, capped by this one. `id-token: write` is
# docs-review's, for the OIDC exchange claude-code-action performs; `issues: read` lets the routine
# read the debt issues that issue-conventions.md rule 6 says a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# Bumped 2026-09-09 from 1d9a445a, eight commits back, for a reason worth writing down: a pinned
# `uses:` did NOT pin the scripts the workflow calls. That repository checked itself out with no
# `ref`, so the scripts always came from its default branch — harmless while scripts are only added,
# and a hard failure the moment one is removed. #23 there removed `scripts/agents_file_check.py`,
# and this repository's `docs / docs-lint` went to exit code 2 within minutes and stayed there.
# `docs-lint.yml` now takes `ref: ${{ github.job_workflow_sha }}`; the other six shared workflows
# still do not, so they read that repository's default branch whatever this file says.
#
# Measured before bumping: `commit-lint.yml`, `pr-body-check.yml` and `docs-review.yml` are
# byte-identical across those eight commits, so three of the five are no-ops. `javadoc-gate.yml`
# grew 197 lines but its one required input became optional and every new input defaults to the
# previous behaviour, so the call below still means what it meant.
#
# Pinned by commit SHA, like every other `uses:` in this repository — `dependabot.yml` explains
# why: a SHA is immune to a moved tag but invisible to a reader, and Dependabot is what keeps it
# current, rewriting the SHA and the trailing comment together. SonarCloud enforces the same rule
# and it is a required check here.
#
# The trailing comment names the ref the SHA came from, not a version and not a date. That
# repository publishes no tags and no releases, so there is no version to name; and a date would
# rot, because Dependabot updates a version comment by finding the PREVIOUS VERSION STRING in it
# and replacing that (dependabot-core#5951) — it has no rule for a date, so the SHA would move and
# the date would not. `@main` stays true whichever commit the SHA is.
#
# Whether Dependabot bumps these at all is worth watching on the first weekly run: it does cover
# reusable-workflow `uses:` (GitHub docs), and for a SHA with no tag behind it, it moves the pin to
# the branch HEAD (dependabot-core#13466, #14716) — which is the behaviour wanted here. Both are
# reports about other people's repositories, not something observed in this one.

jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@7731f9e2e18dca55831f13c758e3a273eb08ea3d # exeris-systems/.github@main
    with:
      # The agent layer of ADR-085 §I.29a and §J.31a. `agents-ref` names the SAME commit
      # .agents/manifest.yaml pins, so the tooling that checks this repository and the semantics it
      # vendors come from one place — which is the whole reason the bundle has a version.
      #
      # Dependabot moves the `uses:` sha above and has no rule for an input, so this value and the
      # manifest pin below drift silently.
      #
      # An earlier version of this comment said `agents_bundle.py verify` catches that. It does
      # not, and the correction is worth keeping: verify compares the MANIFEST pin against the
      # VENDORED TREE, two things that move together in one commit. Nothing compares either of them
      # against this input. It drifted here within a day of the comment being written — manifest at
      # cf98363, this line at b41183a — and every check stayed green.
      #
      # REMOVE THIS LINE once exeris-systems/.github#27 lands: docs-lint then resolves the ref from
      # `imports[].ref` in the manifest, so the commit is named once and cannot disagree with
      # itself. It cannot be removed before that — an unset input means `main` in the version
      # pinned above, which is not this repository's pin.
      agents-ref: 56d9716a74ad911d4a9a8fb055d8259de65dc43c # exeris-systems/exeris-agents 1.4.0
      # ramp, not strict, and deliberately: 113 tracked pages here carry no frontmatter at all.
      # In ramp the gate fails only on files the pull request touches, so a PR is answerable for
      # what it edits and not for a backlog it did not create. Flip to strict when the backfill
      # has landed — 88 of the 113 are machine-fillable, the rest need a type chosen by hand.
      mode: ramp
      # Off until docs/subsystems/*.md carry Contract / Hot path / Failure modes / Owning ADRs.
      # Fifteen subsystem pages exist and none has the section set yet.
      section-check: false
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@7731f9e2e18dca55831f13c758e3a273eb08ea3d # exeris-systems/.github@main
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@7731f9e2e18dca55831f13c758e3a273eb08ea3d # exeris-systems/.github@main
  # The L2 review of ADR-085 §J.33 — the documentation routine, which is not what
  # claude-code-review.yml runs. That workflow reviews the change; this one checks the change
  # against the documentation standards. They are different questions and both are wanted.
  # Skips itself when no Markdown or Java changed.
  docs-review:
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@7731f9e2e18dca55831f13c758e3a273eb08ea3d # exeris-systems/.github@main
    # Named, not `secrets: inherit`. Inherit hands the called workflow every secret this repository
    # has — GPG keys, the Central token, the Packages token — to a job that needs one. SonarCloud
    # flags it (S7631, "Only pass required secrets to this workflow") and is right to.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  # ADR-085 §F.21. This was written to land RED — 62 doclint errors and 100 warnings on
  # exeris-kernel-spi, 13 and 100 on the TCK, measured 2026-09-05 — on the argument that a gate is
  # a worklist and a worklist nobody can see is one nobody clears. The list was cleared before the
  # gate landed, by the javadoc sweep in #456, #464 and #465: both gated modules now report zero
  # doclint errors, zero warnings under failOnWarnings, and zero Checkstyle violations against the
  # bundle ruleset. So it arrives green, and its job is the second one — keeping the list empty
  # rather than showing it. It stays a reported check; making it required is a branch-protection
  # change, not a workflow one.
  #
  # `-Pjavadoc-gate` selects a profile that exists only for this job. The `release` profile keeps
  # `doclint none` on purpose, so that publishing never depends on the state of the prose; putting
  # the strict settings there instead would have made a red gate block a release.
  javadoc:
    uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@7731f9e2e18dca55831f13c758e3a273eb08ea3d # exeris-systems/.github@main
    with:
      # The two published surfaces that are neither Core, Community nor tooling — the set
      # javadoc-conventions.md rule 11 sends to diff-aware checking instead of a hard gate. Every
      # jar module here reaches Maven Central, so "published" alone does not narrow anything; what
      # narrows it is rule 11, and what is left after it is the SPI and the TCK.
      #
      # The set is still SPI + TCK, but the reason rule 11 exempted the rest has expired. Those
      # counts were core 31/100+, community 6/91, community-testkit 0/24, community-kafka 0/11,
      # diagnostics-cli and build-config clean; after #464 and #465 every one of them is 0/0.
      # Adding them here is a decision rather than an oversight: it costs each pom a javadoc-gate
      # profile block, and it holds those modules to a whole-module bar where rule 11 asks only
      # for diff-aware checking. Gating a module whose backfill is already done mandates no
      # backfill, so it does not conflict with rule 11 — it is simply stricter than rule 11 needs.
      modules: exeris-kernel-spi,exeris-kernel-tck
      extra-maven-args: "-Pjavadoc-gate"
