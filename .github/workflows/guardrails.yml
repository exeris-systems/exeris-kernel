# The per-repo footprint of ADR-085 §C.11. Everything it runs lives in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# Nothing in the repository ran these before: the documentation standards were binding but
# unenforced, and the L2 documentation review existed only inside a Cowork session, so a pull
# request could contradict a standard and merge green.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: adr-conventions rule 9 requires the `adr` label on a PR that
    # amends an ADR, so adding the label after a red run has to re-run the gate.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares — not a wish list. Omitting the last two is what
# made the first push of this file an invalid workflow: "requesting 'issues: read, id-token: write',
# but is only allowed 'issues: none, id-token: none'".
#
# Granting them here does not widen docs-lint, commit-lint or pr-body-check: a called workflow's
# jobs receive what its OWN permissions block declares, capped by this one. `id-token: write` is
# docs-review's, for the OIDC exchange claude-code-action performs; `issues: read` lets the routine
# read the debt issues that issue-conventions.md rule 6 says a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

# Pinned by commit SHA, like every other `uses:` in this repository — `dependabot.yml` explains
# why: a SHA is immune to a moved tag but invisible to a reader, and Dependabot is what keeps it
# current, rewriting the SHA and the trailing comment together. SonarCloud enforces the same rule
# and it is a required check here.
#
# The trailing comment carries a date rather than a version because `exeris-systems/.github`
# publishes no tags, so nothing about the SHA says how old it is. Dependabot rewrites both together.

jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@5144f771223069ee7bac0d1c9a0fc6a39bf210c2 # main @ 2026-09-05
    with:
      # ramp, not strict, and deliberately: 113 tracked pages here carry no frontmatter at all.
      # In ramp the gate fails only on files the pull request touches, so a PR is answerable for
      # what it edits and not for a backlog it did not create. Flip to strict when the backfill
      # has landed — 88 of the 113 are machine-fillable, the rest need a type chosen by hand.
      mode: ramp
      # Off until docs/subsystems/*.md carry Contract / Hot path / Failure modes / Owning ADRs.
      # Fifteen subsystem pages exist and none has the section set yet.
      section-check: false
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@5144f771223069ee7bac0d1c9a0fc6a39bf210c2 # main @ 2026-09-05
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@5144f771223069ee7bac0d1c9a0fc6a39bf210c2 # main @ 2026-09-05
  # The L2 review of ADR-085 §J.33 — the documentation routine, which is not what
  # claude-code-review.yml runs. That workflow reviews the change; this one checks the change
  # against the documentation standards. They are different questions and both are wanted.
  # Skips itself when no Markdown or Java changed.
  docs-review:
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@5144f771223069ee7bac0d1c9a0fc6a39bf210c2 # main @ 2026-09-05
    # Named, not `secrets: inherit`. Inherit hands the called workflow every secret this repository
    # has — GPG keys, the Central token, the Packages token — to a job that needs one. SonarCloud
    # flags it (S7631, "Only pass required secrets to this workflow") and is right to.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  # ADR-085 §F.21. Expected RED on the day it lands: 62 doclint errors and 100 warnings on
  # exeris-kernel-spi, measured before switching it on. That is the reason to switch it on — the
  # gate is the worklist, and a worklist nobody can see is a worklist nobody clears. It is a
  # reported check and deliberately not a required one until the count reaches zero.
  #
  # `-Pjavadoc-gate` selects a profile that exists only for this job. The `release` profile keeps
  # `doclint none` on purpose, so that publishing never depends on the state of the prose; putting
  # the strict settings there instead would have made a red gate block a release.
  javadoc:
    uses: exeris-systems/.github/.github/workflows/javadoc-gate.yml@5144f771223069ee7bac0d1c9a0fc6a39bf210c2 # main @ 2026-09-05
    with:
      modules: exeris-kernel-spi
      extra-maven-args: "-Pjavadoc-gate"
