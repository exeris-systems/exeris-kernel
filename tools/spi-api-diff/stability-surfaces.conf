# SPI stability surfaces — machine-readable mirror of docs/stability-matrix.md
#
# This file is the gate's copy of the maturity labels declared in the matrix.
# The matrix is the human-facing source of truth; when a surface changes level
# there, update this file in the same commit. `spi-api-diff.sh --verify-surfaces`
# fails if a package is present in the SPI tree but absent from every list here,
# so a new SPI package cannot silently escape classification.
#
# Format: <level>=<comma-separated japicmp include expressions>
# Expressions are package names or fully-qualified class names; japicmp matches
# a package prefix on packages and exactly on classes.
#
# Gate semantics (see docs/stability-matrix.md §Semver policy):
#   stable       — a binary- OR source-incompatible change FAILS the build. Both, because
#                  adding an abstract method to an interface is binary-compatible and
#                  breaks every implementor at invoke time; only the source check sees it.
#   preview      — reported in the release diff, never fails the build.
#   experimental — reported, never fails; no guarantees in any version.
#   internal     — excluded from the consumer-facing report entirely.
#
# A `mixed` package must list EVERY one of its classes. japicmp only compares what
# an include expression selects, so a class named in no list is neither gated nor
# reported — a silent hole, not a missing warning. `--verify-surfaces` checks per
# fully-qualified class name precisely to make that impossible; do not "fix" a
# report from it by widening a class entry to its package.
#
# Deliberate asymmetry — `spi.exceptions` is stable in full, including the
# `…exceptions.graph` / `.contract` subtrees, even though those domains are
# themselves `preview`. The Glass-Box error taxonomy (code + rawArgs layout) is
# one contract regardless of how settled the subsystem behind it is: an operator
# parses `EX-GRAPH-*` the same way whether or not the graph SPI is still moving.
# Stability of the failure vocabulary is not stability of the API that raises it.

stable=\
eu.exeris.kernel.spi.diagnostics,\
eu.exeris.kernel.spi.persistence,\
eu.exeris.kernel.spi.flow,\
eu.exeris.kernel.spi.memory,\
eu.exeris.kernel.spi.transport,\
eu.exeris.kernel.spi.exceptions,\
eu.exeris.kernel.spi.telemetry,\
eu.exeris.kernel.spi.bootstrap,\
eu.exeris.kernel.spi.context,\
eu.exeris.kernel.spi.config,\
eu.exeris.kernel.spi.http,\
eu.exeris.kernel.spi.security,\
eu.exeris.kernel.spi.events,\
eu.exeris.kernel.spi.crypto,\
eu.exeris.kernel.spi.scheduling,\
eu.exeris.kernel.spi.storage

preview=\
eu.exeris.kernel.spi.contract,\
eu.exeris.kernel.spi.graph,\
eu.exeris.kernel.spi.time,\
eu.exeris.kernel.spi.websocket

experimental=

# `HttpConfigValidation` sits inside the stable `spi.http` package and is labelled
# internal as well: an exact class entry wins over its package for the architecture
# test, and the API diff drops it because it is package-private.
internal=\
eu.exeris.kernel.spi.util,\
eu.exeris.kernel.spi.http.HttpConfigValidation
